<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" font-family="serif" font-size="16">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black" />
    </marker>
  </defs>
  <!-- ombre au sol -->
  <line x1="220" y1="230" x2="560" y2="230" stroke="#999" stroke-width="6" />
  <!-- sol -->
  <line x1="0" y1="230" x2="600" y2="230" stroke="black" />
  <!-- pyramide -->
  <polygon points="20,230 120,60 220,230" fill="#f3e3b5" stroke="black" />
  <!-- hauteur -->
  <line x1="120" y1="60" x2="120" y2="230" stroke="black" stroke-dasharray="5 4" />
  <polyline points="120,220 130,220 130,230" fill="none" stroke="black" />
  <!-- rayon de soleil -->
  <line x1="120" y1="60" x2="560" y2="230" stroke="#d98c00" stroke-dasharray="8 4" />
  <!-- Maxime -->
  <line x1="500" y1="230" x2="500" y2="206.8" stroke="black" stroke-width="3" />
  <polyline points="490,230 490,220 500,220" fill="none" stroke="black" />
  <!-- points -->
  <text x="112" y="52">S</text>
  <text x="114" y="250">H</text>
  <text x="214" y="250">B</text>
  <text x="494" y="250">M</text>
  <text x="496" y="200">T</text>
  <text x="555" y="250">O</text>
  <text x="330" y="222" font-size="13">ombre</text>
  <!-- cotes -->
  <g stroke="black" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)">
    <line x1="120" y1="272" x2="220" y2="272" />
    <line x1="220" y1="272" x2="560" y2="272" />
    <line x1="500" y1="292" x2="560" y2="292" />
  </g>
  <g stroke="#888" stroke-width="0.8" stroke-dasharray="2 2">
    <line x1="120" y1="255" x2="120" y2="280" />
    <line x1="220" y1="235" x2="220" y2="280" />
    <line x1="560" y1="235" x2="560" y2="300" />
    <line x1="500" y1="255" x2="500" y2="300" />
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="170" y="268">115 m</text>
    <text x="390" y="268">80 m</text>
    <text x="530" y="288">2,40 m</text>
    <text x="490" y="214" text-anchor="end">1,80 m</text>
  </g>
</svg>
